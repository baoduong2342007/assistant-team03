plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'vn.team03.bepnha'
    compileSdk 36
    defaultConfig {
        applicationId 'vn.team03.bepnha'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        def assistantUrl = providers.gradleProperty('assistantBaseUrl').getOrElse('')
        if (assistantUrl && !(assistantUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?(\/[A-Za-z0-9_\/-]*)?/)) {
            throw new GradleException('assistantBaseUrl must be an HTTPS origin/base path')
        }
        buildConfigField 'String', 'ASSISTANT_BASE_URL', '"' + assistantUrl + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
