[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "CSC10014 Smart Virtual Assistant — starter"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "google-genai>=1.30,<2", "httpx>=0.28,<1"]

[tool.setuptools.package-data]
bep_nha_api = ["recipes.json"]
